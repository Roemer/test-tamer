services:
  dev.local:
    build:
      dockerfile: Dockerfile
    env_file:
      - .env
    init: true
    volumes:
      - ..:/workspaces:cached
    command: sleep infinity

  db.local:
    image: postgres:18
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${TEST_TAMER_POSTGRES_USER}
      - POSTGRES_PASSWORD=${TEST_TAMER_POSTGRES_PASSWORD}
      - POSTGRES_DB=${TEST_TAMER_POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  postgres-data:
